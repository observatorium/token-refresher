version: "2"
run:
  concurrency: 4
  tests: true
linters:
  settings:
    funlen:
      lines: 110
      statements: 60
    lll:
      line-length: 140
    errcheck:
      exclude-functions:
      - (github.com/go-kit/log.Logger).Log
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
